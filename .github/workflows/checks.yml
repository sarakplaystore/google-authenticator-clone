name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK packaging and signature checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the checked-in APK
        # Verifies the DEX format, the ZIP alignment, the v1 signature
        # coverage, the v2/v3 content digest and the signing certificate.
        # An APK whose signature does not match its own contents is rejected
        # by Android 7.0 and newer, so this has to run on every change.
        run: python3 tests/check_apk_compatibility.py Authenticator.apk
      - name: Run the regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
