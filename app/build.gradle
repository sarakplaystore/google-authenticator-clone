plugins {
    id "com.android.application"
}

android {
    namespace "app.openauth.authenticator"
    compileSdk 35

    defaultConfig {
        applicationId "app.openauth.authenticator"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.5.2"
    }

    // Android 6.0 cannot install APKs signed only with v2/v3, and every
    // release needs a v2/v3 signature because the APK must be installable on
    // modern Android as well. The signing identity lives in the repository
    // (tools/debug.keystore) so that a rebuild keeps the same certificate:
    // a different certificate makes Android refuse to update an existing
    // installation with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    signingConfigs {
        debug {
            storeFile file("../tools/debug.keystore")
            storePassword "android"
            keyAlias "authenticator-debug"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
