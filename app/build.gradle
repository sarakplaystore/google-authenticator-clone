plugins {
    id "com.android.application"
}

android {
    namespace "app.openauth.authenticator"
    compileSdk 35

    defaultConfig {
        applicationId "app.openauth.authenticator"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    // Android 6.0 cannot install APKs signed only with v2/v3.
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
