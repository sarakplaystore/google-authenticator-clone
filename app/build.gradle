plugins {
    id "com.android.application"
}

android {
    namespace "app.openauth.authenticator"
    compileSdk 35

    defaultConfig {
        applicationId "app.openauth.authenticator"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
